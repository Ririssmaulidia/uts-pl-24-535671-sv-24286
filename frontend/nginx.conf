server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Teruskan semua permintaan /api ke container Laravel lewat NAMA SERVICE
    # ("backend") di jaringan Docker Compose, bukan alamat IP laptop.
    # Resolver bawaan Docker (127.0.0.11) + variabel membuat Nginx tidak gagal
    # start bila backend belum siap saat konfigurasi dibaca.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue Router (history mode): semua path lain dikembalikan ke index.html,
    # sehingga me-refresh halaman seperti /expenses tidak menghasilkan 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
