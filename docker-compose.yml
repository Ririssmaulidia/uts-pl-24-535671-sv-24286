name: uts-pl

services:
  # ── 1. Basis data ────────────────────────────────────────
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Buat file .env dari .env.example}
      MYSQL_USER: ${DB_USERNAME:?Buat file .env dari .env.example}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Isi DB_ROOT_PASSWORD di file .env}
    volumes:
      # Named volume: data tetap ada setelah "docker compose down".
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── 2. Backend Laravel ───────────────────────────────────
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_NAME: "Catatan Pengeluaran"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Isi APP_KEY di file .env (lihat .env.example)}
      APP_URL: http://localhost:${FRONTEND_PORT:-8080}
      LOG_CHANNEL: stderr
      # Terhubung ke basis data lewat NAMA SERVICE "db", bukan alamat IP.
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:?Buat file .env dari .env.example}
      DB_USERNAME: ${DB_USERNAME:?Buat file .env dari .env.example}
      DB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-mahasiswa@example.com}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-password123}
    ports:
      # Dibuka ke laptop agar bisa diuji dengan Postman.
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── 3. Frontend Vue (Nginx) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        # Path relatif: browser memanggil /api di origin yang sama, lalu Nginx
        # meneruskannya ke service "backend".
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
