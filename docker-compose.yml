name: uts-pl

# Pembatasan ukuran log (soal 6). Tanpa ini, log container tumbuh tanpa batas
# dan bisa memenuhi disk. Dengan max-size 10m dan max-file 3, tiap container
# menyimpan paling banyak 3 berkas log @ 10 MB (sekitar 30 MB), berkas tertua
# dibuang otomatis (rotasi).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── 1. Basis data ────────────────────────────────────────
  db:
    image: mysql:8.4
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Buat file .env dari .env.example}
      MYSQL_USER: ${DB_USERNAME:?Buat file .env dari .env.example}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Isi DB_ROOT_PASSWORD di file .env}
    volumes:
      # Named volume: data tetap ada setelah "docker compose down".
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── 2. Backend Laravel ───────────────────────────────────
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_NAME: "Catatan Pengeluaran"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Isi APP_KEY di file .env (lihat .env.example)}
      APP_URL: http://localhost:${FRONTEND_PORT:-8080}
      # Log Laravel keluar ke STDOUT (channel "stdout" di config/logging.php),
      # bukan ke berkas storage/logs di dalam container, sehingga terbaca lewat
      # "docker compose logs backend". Formatnya JSON satu baris per catatan.
      LOG_CHANNEL: stdout
      LOG_LEVEL: info
      # Terhubung ke basis data lewat NAMA SERVICE "db", bukan alamat IP.
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:?Buat file .env dari .env.example}
      DB_USERNAME: ${DB_USERNAME:?Buat file .env dari .env.example}
      DB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-mahasiswa@example.com}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-password123}
    ports:
      # Dibuka ke laptop agar bisa diuji dengan Postman.
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /health benar-benar memeriksa basis data dan cache. Bila membalas 503,
      # wget keluar dengan kode non-nol sehingga Docker menandai: unhealthy.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/health || exit 1"]
      interval: 10s       # periksa tiap 10 detik
      timeout: 5s         # satu pemeriksaan dianggap gagal bila lebih dari 5 detik
      retries: 3          # unhealthy setelah 3 kegagalan BERUTURUT-TURUT
      start_period: 40s   # masa tenggang: migration + seeder + server menyala

  # ── 3. Frontend Vue (Nginx) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        # Path relatif: browser memanggil /api di origin yang sama, lalu Nginx
        # meneruskannya ke service "backend".
        VITE_API_URL: /api
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db_data:
