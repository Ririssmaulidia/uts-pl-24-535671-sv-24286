name: CI/CD

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "24"

jobs:
  # ── JOB 1: pengujian backend ────────────────────────────────
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          # Kata sandi diambil dari GitHub Secrets, tidak ada di repository.
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: uts_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Pastikan GitHub Secrets sudah dibuat
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$APP_KEY" ] || [ -z "$DB_PASSWORD" ]; then
            echo "::error::Secret APP_KEY dan/atau DB_PASSWORD belum dibuat (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Install dependensi Composer
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Jalankan php artisan test
        env:
          APP_ENV: testing
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: uts_test
          DB_USERNAME: root
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: php artisan test

  # ── JOB 2: build frontend ───────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependensi (npm ci)
        run: npm ci

      - name: Build aplikasi Vue (npm run build)
        env:
          VITE_API_URL: /api
        run: npm run build

  # ── JOB 3: deploy (build + push image ke GHCR) ──────────────
  # HANYA untuk push ke branch main. Pull Request, branch dev, dan branch
  # fitur berhenti setelah dua job di atas.
  deploy:
    name: Deploy (GHCR)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      # GHCR menolak huruf besar; nama akun GitHub boleh berhuruf besar.
      - name: Tentukan nama image (huruf kecil semua)
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke ghcr.io dengan GITHUB_TOKEN
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dan push image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # Tag = nomor commit (bukan latest).
          tags: ${{ steps.image.outputs.prefix }}-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build dan push image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: ${{ steps.image.outputs.prefix }}-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Ringkasan
        run: |
          echo "Image terbit:"
          echo "  ${{ steps.image.outputs.prefix }}-backend:${{ github.sha }}"
          echo "  ${{ steps.image.outputs.prefix }}-frontend:${{ github.sha }}"
